name: Build Noor-e-Dua APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/noor-e-dua-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode exact app icon
        run: |
          base64 -d noor_icon_exact.b64 > app/src/main/res/drawable/noor_icon_exact.webp
          cp app/src/main/res/drawable/noor_icon_exact.webp app/src/main/assets/noor_icon.webp

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Noor-e-Dua.apk
          ls -lh dist/Noor-e-Dua.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Dua-APK
          path: android/dist/Noor-e-Dua.apk
          if-no-files-found: error
          retention-days: 30
