name: Build Noor-e-Dua APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/noor-e-dua-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Noor-e-Dua.apk
          ls -lh dist/Noor-e-Dua.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-e-Dua-APK
          path: android/dist/Noor-e-Dua.apk
          if-no-files-found: error
          retention-days: 30
